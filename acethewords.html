<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AceTheWords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6fb; --surface: #ffffff; --surface-2: #f0f2f8; --text: #1c2033; --muted: #646b85; --border: #e2e5ef;
  --primary: #5b5bd6; --primary-2: #4646c0; --primary-soft: #ececfd; --on-primary: #ffffff;
  --good: #16955a; --good-soft: #e3f5eb; --bad: #e0464b; --bad-soft: #fdeced; --warn: #b86e00; --warn-soft: #fff3de;
  --st-new: #cdd2e1; --st-learning: #f5a524; --st-practicing: #4a8cf7; --st-memorized: #16955a;
  --shadow: 0 1px 2px rgba(20,24,50,.05), 0 6px 20px rgba(20,24,50,.06);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111219; --surface: #1a1c26; --surface-2: #232633; --text: #eceef6; --muted: #9aa0b8; --border: #2d3140;
    --primary: #8d8df7; --primary-2: #a6a6ff; --primary-soft: #282a4a; --on-primary: #111219;
    --good: #3ccf7e; --good-soft: #15301f; --bad: #ff6b70; --bad-soft: #3a1c1f; --warn: #f0a83a; --warn-soft: #3a2b12;
    --st-new: #3a3f52; --st-learning: #f0a83a; --st-practicing: #5f9bff; --st-memorized: #3ccf7e;
    --shadow: none;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 16px/1.5 "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--primary); }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 64px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.qword.small { font-size: 26px; margin-top: 12px; }
.hidden { display: none !important; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
.topbar .wrap { display: flex; align-items: center; gap: 12px; padding-top: 10px; padding-bottom: 10px; }
.brand { font-weight: 800; font-size: 20px; letter-spacing: -.3px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
.brand-dot { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font-size: 15px; }
.nav { display: flex; gap: 4px; }
.apipill { border: 1px solid var(--border); background: var(--surface); border-radius: 99px; padding: 4px 10px; font-weight: 800; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--muted); white-space: nowrap; }
.apipill i { width: 8px; height: 8px; border-radius: 50%; background: var(--st-new); }
.apipill.ok i { background: var(--good); }
.apipill.bad { color: var(--bad); border-color: var(--bad); background: var(--bad-soft); }
.apipill.bad i { background: var(--bad); }
.apipill.busy i { background: var(--warn); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (max-width: 520px) { .apipill .lab { display: none; } }
.thumbs { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.thumb { position: relative; }
.thumb img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); display: block; }
.thumb button { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--text); color: var(--bg); cursor: pointer; font-size: 12px; }
.log-row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; align-items: start; }
.statusbox { border-radius: 12px; padding: 12px 14px; font-weight: 600; margin: 10px 0; }
.statusbox.ok { background: var(--good-soft); color: var(--good); } .statusbox.bad { background: var(--bad-soft); color: var(--bad); }
.statusbox.off, .statusbox.idle, .statusbox.busy { background: var(--surface-2); color: var(--muted); }
.nav a { text-decoration: none; color: var(--muted); font-weight: 700; padding: 6px 10px; border-radius: 10px; font-size: 15px; }
.nav a.on { background: var(--primary-soft); color: var(--primary); }
@media (max-width: 520px) { .nav a { padding: 6px 7px; font-size: 14px; } .brand span.name { display: none; } }

h1 { font-size: 26px; margin: 24px 0 8px; letter-spacing: -.4px; }
h2 { font-size: 18px; margin: 28px 0 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); margin: 12px 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

.btn { border: 0; border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; background: var(--surface-2); color: var(--text); transition: transform .05s, background .15s; }
.btn:hover { filter: brightness(.97); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--primary); color: var(--on-primary); }
.btn.primary:hover { background: var(--primary-2); }
.btn.big { padding: 14px 22px; font-size: 17px; border-radius: 14px; }
.btn.ghost { background: transparent; border: 1px solid var(--border); }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.sm { padding: 6px 10px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.iconbtn { border: 0; background: var(--surface-2); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 17px; display: inline-grid; place-items: center; vertical-align: middle; }

input[type=text], input[type=password], input[type=date], input[type=number], input[type=search], select, textarea {
  background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; width: 100%;
}
textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
label.field { display: block; margin: 10px 0; }
label.field > span { display: block; font-weight: 700; font-size: 14px; margin-bottom: 4px; }
.check { display: flex; gap: 8px; align-items: center; }

/* progress bars */
.bar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; background: var(--primary); transition: width .4s ease; }
.bar.thick { height: 16px; }
.bar.thin { height: 6px; }
.bar .s-new { background: var(--st-new); } .bar .s-learning { background: var(--st-learning); }
.bar .s-practicing { background: var(--st-practicing); } .bar .s-memorized { background: var(--st-memorized); }
.bar.good > span { background: var(--good); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

.chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.new { background: var(--surface-2); }
.chip.learning { background: color-mix(in srgb, var(--st-learning) 20%, transparent); color: var(--warn); }
.chip.practicing { background: color-mix(in srgb, var(--st-practicing) 18%, transparent); color: var(--st-practicing); }
.chip.memorized { background: var(--good-soft); color: var(--good); }
.chip.lchip { display: inline-flex; align-items: center; gap: 4px; }
.chip.lchip .x { border: 0; background: none; color: inherit; cursor: pointer; padding: 0 0 0 2px; font-size: 11px; line-height: 1; opacity: .7; }
.chip.lchip .x:hover { opacity: 1; color: var(--bad); }

/* home */
.hero .big { font-size: 44px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.hero-top { display: flex; align-items: flex-end; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.streak { margin-left: auto; font-weight: 800; background: var(--warn-soft); color: var(--warn); padding: 6px 12px; border-radius: 99px; font-size: 14px; }
.modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 12px 0; }
.mode { text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
.mode:hover { border-color: var(--primary); }
.mode .emoji { font-size: 28px; }
.mode .title { font-weight: 800; font-size: 19px; }
.mode .count { font-weight: 700; color: var(--primary); }
.mtext { display: flex; flex-direction: column; gap: 2px; }
@media (max-width: 600px) {
  .modes { grid-template-columns: 1fr; gap: 8px; }
  .mode { flex-direction: row; align-items: center; gap: 14px; padding: 14px 16px; }
  .mode .mtext .muted { display: none; }
}
.units { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.unit { flex: 1 1 90px; min-width: 90px; max-width: 150px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; font-size: 13px; }
.unit b { display: block; font-size: 13px; }
.unit.locked { opacity: .55; }
.unit.cur { outline: 2px solid var(--primary); }
.warnbox { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 10px; font-weight: 600; }
.forecast { display: flex; align-items: flex-end; gap: 6px; height: 110px; padding-top: 8px; }
.fc-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 4px; min-width: 0; }
.fc-stack { width: 100%; max-width: 26px; display: flex; flex-direction: column-reverse; border-radius: 6px; overflow: hidden; }
.fc-stack .r { background: var(--primary); } .fc-stack .n { background: var(--st-learning); }
.fc-lab { font-size: 11px; color: var(--muted); white-space: nowrap; }
.fc-num { font-size: 11px; color: var(--muted); }
.fc-col.test .fc-lab { color: var(--bad); font-weight: 800; }
.lists-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 12px 0; }
@media (max-width: 600px) { .lists-grid { grid-template-columns: 1fr; } }
.ltile { text-decoration: none; color: inherit; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); cursor: pointer; display: flex; flex-direction: column; gap: 8px; min-height: 150px; min-width: 0; }
.ltile:hover { border-color: var(--primary); }
.ltile .lname { font-weight: 800; font-size: 19px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ltile .lpct { font-size: 30px; font-weight: 800; line-height: 1; letter-spacing: -.5px; }
.ltile .lstatus { font-size: 14px; font-weight: 700; color: var(--primary); margin-top: auto; }
.sitefoot { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 14px; padding: 28px 16px 90px; }
body.studying .sitefoot, body.in-session .sitefoot { display: none; }
.starbtn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 999px; padding: 6px 14px; font-weight: 700; text-decoration: none; }
.starbtn:hover { border-color: var(--primary); }
.starbtn #starCount:not(:empty) { border-left: 1px solid var(--border); padding-left: 8px; color: var(--muted); }
.ltile.archived { opacity: .55; filter: grayscale(1); box-shadow: none; }
.ltile.archived:hover { opacity: .8; border-color: var(--muted); }
.ltile.archived .lstatus { color: var(--muted); }
.ltile.newtile { border: 2px dashed var(--border); background: transparent; box-shadow: none; align-items: center; justify-content: center; color: var(--primary); font: inherit; font-weight: 800; font-size: 17px; }
.ltile.newtile:hover { border-color: var(--primary); background: var(--primary-soft); }
.backlink { display: inline-block; margin-top: 18px; font-weight: 700; text-decoration: none; color: var(--muted); font-size: 15px; }
.backlink:hover { color: var(--primary); }
.list-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 4px 0 4px; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; min-width: 190px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.16); padding: 6px; display: flex; flex-direction: column; }
.menu[hidden] { display: none; }
.menu button { border: 0; background: none; text-align: left; padding: 9px 12px; border-radius: 8px; font: inherit; font-weight: 600; color: var(--text); cursor: pointer; }
.menu button:hover, .menu button:focus-visible { background: var(--surface-2); outline: none; }
.menu button.danger { color: var(--bad); }
.modal-alt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }
.btn.danger-solid { background: var(--bad); color: #fff; }
.list-head h1 { margin: 0; margin-right: auto; overflow-wrap: anywhere; }

/* word list */
.wl-filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 8px; }
@media (max-width: 600px) { .wl-filters { grid-template-columns: 1fr 1fr; } .wl-filters input { grid-column: 1 / -1; } }
.wl-row { display: grid; grid-template-columns: minmax(110px, 1.1fr) 2.4fr auto 90px; gap: 12px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--border); cursor: pointer; }
.wl-row:hover { background: var(--surface-2); }
.wl-row .w { font-weight: 800; }
.wl-row .d { color: var(--muted); font-size: 14px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
@media (max-width: 600px) { .wl-row { grid-template-columns: 1fr auto; } .wl-row .d { grid-column: 1 / -1; grid-row: 2; } .wl-row .bar { grid-column: 1 / -1; } }

/* add progress */
.ap-row { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.ap-row .w { font-weight: 800; min-width: 110px; }
.ok { color: var(--good); } .err { color: var(--bad); } .wait { color: var(--muted); }

/* modal */
.modal-back { position: fixed; inset: 0; background: rgba(10,12,25,.45); z-index: 50; display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 20px; width: 100%; max-width: 620px; padding: 22px; box-shadow: 0 20px 60px rgba(0,0,0,.25); position: relative; }
.modal .close { position: absolute; top: 14px; right: 14px; }
.sense { display: flex; gap: 10px; padding: 8px; border-radius: 10px; cursor: pointer; align-items: flex-start; }
.sense:hover { background: var(--surface-2); }
.sense.on { background: var(--primary-soft); }
.kv { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.kv div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; }
.kv b { display: block; font-size: 18px; }
@media (max-width: 520px) { .kv { grid-template-columns: 1fr 1fr; } }
details summary { cursor: pointer; font-weight: 700; margin: 8px 0; }
ul.tight { margin: 4px 0; padding-left: 20px; } ul.tight li { margin: 3px 0; }

/* session */
#session { position: fixed; inset: 0; background: var(--bg); z-index: 40; overflow-y: auto; }
body.in-session { overflow: hidden; }
.sess-top { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; padding: 14px 16px; }
.sess-top .bar { flex: 1; height: 12px; }
.sess-count { font-weight: 800; color: var(--good); font-size: 14px; white-space: nowrap; }
.sess-pos { font-weight: 800; color: var(--muted); font-size: 14px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.sess-pos.viewing { color: var(--primary); }
.sess-body { max-width: 680px; margin: 0 auto; padding: 8px 16px 60px; }
.qtype { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: var(--primary); margin: 18px 0 6px; }
.qinst { color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.qword { font-size: 40px; font-weight: 800; letter-spacing: -.5px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; line-height: 1.15; }
.qphon { color: var(--muted); font-size: 16px; font-weight: 600; }
.qdef { font-size: 22px; font-weight: 700; line-height: 1.35; }
.qsent { font-size: 22px; font-weight: 600; line-height: 1.5; }
.blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--primary); margin: 0 4px; }
.options { display: grid; gap: 10px; margin-top: 22px; }
.opt { text-align: left; border: 2px solid var(--border); background: var(--surface); border-radius: 14px; padding: 14px 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; font-size: 17px; font-weight: 600; transition: border-color .12s, background .12s; }
.opt:hover:not(:disabled) { border-color: var(--primary); }
.opt .key { flex: none; width: 26px; height: 26px; border-radius: 8px; background: var(--surface-2); display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--muted); margin-top: 1px; }
.opt.correct { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt:disabled { cursor: default; }
.opt.sel { border-color: var(--primary); background: var(--primary-soft); }
.opt.sel .key { background: var(--primary); color: var(--on-primary); }
.btn.sel { outline: 3px solid var(--primary); outline-offset: 2px; }
.rates .btn.picked { outline: 3px solid currentColor; outline-offset: 2px; opacity: 1; }
.iconbtn:disabled { opacity: .35; cursor: default; }
.sess-nav { display: flex; justify-content: space-between; gap: 8px; margin-top: 4px; }
.opt .why { display: block; font-size: 14px; font-weight: 600; color: var(--bad); margin-top: 6px; }
.feedback { margin-top: 18px; border-radius: 16px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); }
.feedback .verdict { font-weight: 800; font-size: 18px; margin-bottom: 6px; }
.feedback .verdict.ok { color: var(--good); } .feedback .verdict.bad { color: var(--bad); }
.ex { font-style: italic; color: var(--muted); margin-top: 6px; }
mark { background: color-mix(in srgb, var(--st-learning) 35%, transparent); color: inherit; border-radius: 4px; padding: 0 2px; }
.flash { background: var(--surface); border: 1px solid var(--border); border-radius: 22px; padding: 30px 24px; box-shadow: var(--shadow); text-align: center; margin-top: 10px; }
.flash .qword { justify-content: center; }
.flash .back { margin-top: 18px; padding-top: 18px; border-top: 1px dashed var(--border); text-align: left; }
.rates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 18px; }
.rates .btn { padding: 12px 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.rates .btn small { font-weight: 600; color: var(--muted); font-size: 12px; }
.rate-1 { background: var(--bad-soft) !important; color: var(--bad) !important; }
.rate-2 { background: var(--warn-soft) !important; color: var(--warn) !important; }
.rate-3 { background: var(--good-soft) !important; color: var(--good) !important; }
.rate-4 { background: var(--primary-soft) !important; color: var(--primary) !important; }
.keyhint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 14px; }
@media (hover: none) { .keyhint, .opt .key { display: none; } }
.sum-row { display: grid; grid-template-columns: 1fr auto 120px; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--border); }
@media (max-width: 520px) { .qword { font-size: 32px; } .qsent, .qdef { font-size: 19px; } .sum-row { grid-template-columns: 1fr auto; } .sum-row .bar { grid-column: 1 / -1; } }

/* toasts */
#toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; width: calc(100% - 32px); max-width: 420px; pointer-events: none; }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 700; box-shadow: 0 8px 24px rgba(0,0,0,.2); animation: pop .25s ease; text-align: center; }
/* ask AI */
#askai { position: fixed; right: 16px; bottom: 16px; z-index: 55; }
body.quiz-open #askai { display: none; }
.askai-fab { border: 0; border-radius: 999px; padding: 12px 18px; font-weight: 800; font-size: 15px; cursor: pointer; background: var(--primary); color: var(--on-primary); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.askai-fab:hover { background: var(--primary-2); }
.askai-panel { width: 360px; max-width: calc(100vw - 32px); height: 480px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.25); overflow: hidden; }
.askai-head { display: flex; align-items: center; gap: 8px; padding: 10px 10px 10px 14px; border-bottom: 1px solid var(--border); }
.askai-msgs { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.askai-msg { padding: 8px 12px; border-radius: 14px; max-width: 88%; line-height: 1.45; font-size: 15px; overflow-wrap: anywhere; }

@keyframes blink { 50% { opacity: 0; } }

.toast.good { background: var(--good); color: #fff; } .toast.bad { background: var(--bad); color: #fff; } .toast.warn { background: var(--warn); color: #fff; }

<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><div class="brand-dot">A</div><span class="name">AceTheWords</span></div>
    <button class="apipill" id="apiPill" data-act="apiPanel" title="AI connection"><i></i>AI<span class="lab"></span></button>
    <nav class="nav" id="nav">
      <a href="#home" data-r="home">Home</a>
      <a href="#add" data-r="add">Add</a>
      <a href="#words" data-r="words">Words</a>
      <a href="#settings" data-r="settings">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap sitefoot">Enjoying AceTheWords? <a class="starbtn" href="https://github.com/itsyuranwei/acethewords" target="_blank" rel="noopener">⭐ Star it on GitHub<span id="starCount"></span></a></footer>
<div id="session" hidden></div>
<div id="modal"></div>
<div id="toasts"></div>
<div id="stale"></div>
<div id="askai"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="importList" accept=".atw" hidden>

<script>
'use strict';

/* ============================== utils ============================== */
const DAY = 864e5;
const clock = { offset: 0, now() { return Date.now() + this.offset; } };
const pad = n => String(n).padStart(2, '0');
const dayKey = ts => { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const startOfDay = ts => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };
const parseDay = key => { const [y, m, d] = key.split('-').map(Number); return new Date(y, m - 1, d).getTime(); };
const daysUntil = key => Math.round((parseDay(key) - startOfDay(clock.now())) / DAY);
const todayKey = () => dayKey(clock.now());
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const escRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const uniq = a => [...new Set(a)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const norm = s => String(s).toLowerCase().replace(/[^a-z ]/g, '').replace(/\s+/g, ' ').trim();
const fmtDay = key => new Date(parseDay(key)).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;

async function pool(items, n, fn) {
  let i = 0;
  const worker = async () => { while (i < items.length) { const it = items[i++]; await fn(it); } };
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, worker));
}

// Matches the word and its common inflections (persuade → persuaded, happy → happily).
function stemRe(word, flags = 'i') {
  const w = word.toLowerCase();
  let src;
  if (w.length <= 3) src = escRe(w) + '(?:s|es|ed|ing)?\\b';
  else if (w.endsWith('y')) src = escRe(w.slice(0, -1)) + '(?:y|i)[a-z]*';
  else if (w.endsWith('e')) src = escRe(w.slice(0, -1)) + 'e?[a-z]*';
  else src = escRe(w) + '[a-z]*';
  return new RegExp('\\b' + src, flags);
}

/* ============================== store ============================== */
const KEY = 'rememberit:v1';
const DEFAULT_SETTINGS = {
  provider: 'codex', deepseekKey: '', bridgeToken: '', model: 'deepseek-flash', grade: 11, retention: 0.9,
  newPerDay: 15, dailyCap: 100, sessionSize: 20, batchSize: 8, learnChecks: 2, useSpeed: true,
};
// Allowed range for each number setting.
const SETTING_LIMITS = {
  grade: [3, 12], newPerDay: [1, 50], dailyCap: [10, 400], sessionSize: [5, 60], batchSize: [3, 100], learnChecks: [1, 3],
};
let db;
const store = {
  blank() {
    return { version: 2, lists: {}, words: {}, settings: { ...DEFAULT_SETTINGS }, daily: { date: '', done: 0 }, streak: { last: '', count: 0 }, apiLog: [], rt: {}, model: null };
  },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(KEY)); } catch { d = null; }
    if (!isObj(d)) d = null;
    db = d ? { ...this.blank(), ...d, settings: { ...DEFAULT_SETTINGS, ...(d.settings || {}) } } : this.blank();
    db.words = fixAll(db.words, fixWord);
    db.lists = fixAll(db.lists, fixList);
    for (const k of ['daily', 'streak', 'rt']) if (!isObj(db[k])) db[k] = this.blank()[k];
    if (!Array.isArray(db.apiLog)) db.apiLog = [];
    // deepseek-chat is no longer offered; deepseek-flash (V4.1 Flash) replaces it.
    if (!db.settings.model || db.settings.model === 'deepseek-chat') db.settings.model = 'deepseek-flash';
    // Saved before Codex and Claude Code were offered: keep using DeepSeek if a key was set.
    if (!d?.settings?.provider) db.settings.provider = db.settings.deepseekKey ? 'deepseek' : DEFAULT_SETTINGS.provider;
    for (const [k, [lo, hi]] of Object.entries(SETTING_LIMITS)) db.settings[k] = clamp(Math.round(Number(db.settings[k]) || DEFAULT_SETTINGS[k]), lo, hi);
    // Version 1 kept one list per word; version 2 lets a word sit in several lists. Lists' units already say which words they hold, so rebuild from them.
    db.version = 2;
    units.reindex();
    units.adoptOrphans();
    return db;
  },
  stale: false,
  save() {
    if (store.stale) return; // another tab has newer data; saving here would overwrite it
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch { toast('Could not save — browser storage is full or blocked', 'bad'); }
  },
  exportJSON() {
    const copy = JSON.parse(JSON.stringify(db));
    copy.settings.deepseekKey = '';
    copy.settings.bridgeToken = '';
    copy.apiLog = [];
    return JSON.stringify(copy);
  },
  importJSON(text) {
    const inc = JSON.parse(text);
    if (!isObj(inc) || !isObj(inc.words)) throw new Error('Not an AceTheWords backup');
    let added = 0, updated = 0;
    for (const [k, w] of Object.entries(fixAll(inc.words, fixWord))) {
      const cur = db.words[k];
      if (!cur) { db.words[k] = w; added++; }
      else if ((w.mem?.lastReview || 0) > (cur.mem?.lastReview || 0)) { db.words[k] = w; updated++; }
    }
    for (const [name, l] of Object.entries(fixAll(inc.lists, fixList))) {
      const cur = db.lists[name];
      if (!cur) { db.lists[name] = l; continue; }
      const have = new Set(cur.units.flat());
      const missing = l.units.flat().filter(k => !have.has(k));
      if (missing.length) units.append(name, missing);
      if (!cur.testDate && l.testDate) cur.testDate = l.testDate;
    }
    units.reindex();
    units.adoptOrphans();
    this.save();
    return { added, updated };
  },
};

// Saved data can come from an older version or a hand-edited backup. These fill in anything missing or damaged,
// so one bad word or list can't stop the app from loading. Entries that aren't objects are dropped.
const isObj = x => !!x && typeof x === 'object' && !Array.isArray(x);
const arr = x => (Array.isArray(x) ? x : []);
// Names like "__proto__" would reach the object's own machinery instead of being a word or list, so they are dropped.
const RESERVED_KEYS = new Set(['__proto__', 'constructor', 'prototype']);
const fixAll = (o, fix) => Object.fromEntries(Object.entries(isObj(o) ? o : {}).filter(([k]) => !RESERVED_KEYS.has(k)).map(([k, v]) => [k, fix(k, v)]).filter(([, v]) => v));
const GEN_LISTS = ['blank_sentences', 'blank_easy_distractors', 'blank_hard_distractors', 'meaning_hard_distractors', 'lookalike_words', 'correct_usages', 'incorrect_usages'];
function fixWord(k, w) {
  if (!isObj(w)) return null;
  const mem = { ...newMem(), ...(isObj(w.mem) ? w.mem : {}) };
  for (const n of ['S', 'D', 'lastReview', 'reps', 'lapses']) if (!Number.isFinite(mem[n])) mem[n] = 0;
  mem.successDays = arr(mem.successDays);
  mem.history = arr(mem.history).filter(isObj);
  const primary = { m: 0, d: 0, manual: false, ...(isObj(w.primary) ? w.primary : {}) };
  // Dropping a damaged meaning or definition shifts the ones after it, so the chosen sense is followed to its new place.
  let data = null, pm = 0, pd = 0;
  if (isObj(w.data) && Array.isArray(w.data.meanings)) {
    const meanings = [];
    w.data.meanings.forEach((m, mi) => {
      if (!isObj(m)) return;
      const defs = [];
      arr(m.defs).forEach((d, di) => {
        if (!isObj(d) || typeof d.def !== 'string') return;
        if (mi === primary.m && di === primary.d) { pm = meanings.length; pd = defs.length; }
        defs.push(d);
      });
      meanings.push({ ...m, defs, synonyms: arr(m.synonyms), antonyms: arr(m.antonyms) });
    });
    data = { ...w.data, meanings };
    // Pronunciation audio only ever comes from the dictionary; any other address (from an edited file) is dropped.
    if (!/^https:\/\/api\.dictionaryapi\.dev\//.test(String(data.audio || ''))) data.audio = '';
  }
  const g = isObj(w.gen) ? { ...w.gen } : null;
  if (g) { for (const f of GEN_LISTS) g[f] = arr(g[f]); g.incorrect_usages = g.incorrect_usages.filter(isObj); }
  return { ...newWord(k, typeof w.list === 'string' ? w.list : ''), ...w, word: k, mem, data, gen: g, primary: { ...primary, m: pm, d: pd } };
}
function fixList(name, l) {
  if (!isObj(l)) return null;
  const us = arr(l.units).filter(Array.isArray).map(u => u.filter(k => typeof k === 'string'));
  return {
    ...l, name, units: us,
    testDate: /^\d{4}-\d{2}-\d{2}$/.test(l.testDate) ? l.testDate : '',
    unitSize: Number(l.unitSize) > 0 ? Number(l.unitSize) : Math.max(10, ...us.map(u => u.length)),
    unlocked: clamp(Math.round(Number(l.unlocked)) || 1, 1, Math.max(1, us.length)),
  };
}

function newMem() {
  return { S: 0, D: 0, lastReview: 0, lastDay: '', reps: 0, lapses: 0, successDays: [], memorized: false, history: [] };
}
function newWord(word, list) {
  return {
    word, list, unit: 0, lists: {}, addedAt: clock.now(), data: null, dictStatus: 'pending',
    primary: { m: 0, d: 0, manual: false }, customDef: '', gen: null, genStatus: 'none', genError: '', mem: newMem(),
  };
}

/* ============================== word info ============================== */
const info = {
  senses(w) {
    const out = [];
    (w.data?.meanings || []).forEach((m, mi) => m.defs.forEach((d, di) => out.push({ m: mi, d: di, pos: m.pos, def: d.def, example: d.example })));
    return out;
  },
  primarySense(w) {
    const m = w.data?.meanings?.[w.primary.m];
    const d = m?.defs?.[w.primary.d];
    return d ? { pos: m.pos, def: d.def, example: d.example } : null;
  },
  // Default sense without DeepSeek: skip labelled senses like "(slang)", prefer early, short ones with an example.
  bestSense(w) {
    let best = null, bestScore = -Infinity;
    for (const s of info.senses(w)) {
      const score = (/^\(/.test(s.def) ? -4 : 0) + (s.example && stemRe(w.word).test(s.example) ? 1 : 0) +
        (s.def.length < 90 ? 0.5 : 0) - s.m * 0.6 - s.d * 0.35;
      if (score > bestScore) { bestScore = score; best = s; }
    }
    return best ? { m: best.m, d: best.d, manual: false } : { m: 0, d: 0, manual: false };
  },
  def(w) { return w.customDef || w.gen?.simple_definition || info.primarySense(w)?.def || ''; },
  pos(w) {
    if (w.gen?.pos) return w.gen.pos;
    // A custom definition may not match the dictionary sense, so guess from its wording.
    if (w.customDef) return /^to /i.test(w.customDef) ? 'verb' : /^(a|an|the|someone|something) /i.test(w.customDef) ? 'noun' : '';
    return info.primarySense(w)?.pos || '';
  },
  example(w) {
    if (w.gen?.example) return w.gen.example;
    if (w.customDef) return '';
    const p = info.primarySense(w);
    if (p?.example && stemRe(w.word).test(p.example)) return p.example;
    return info.examplesWithWord(w)[0] || '';
  },
  examplesWithWord(w) {
    const re = stemRe(w.word);
    const ex = [];
    if (w.customDef && !w.gen) return ex; // dictionary examples may be for a different meaning
    const p = info.primarySense(w);
    if (p?.example) ex.push(p.example);
    if (w.gen?.example) ex.push(w.gen.example);
    for (const m of w.data?.meanings || []) for (const d of m.defs) if (d.example) ex.push(d.example);
    return uniq(ex).filter(s => re.test(s));
  },
  synonyms(w) { const m = w.data?.meanings?.[w.primary.m]; return m ? m.synonyms.slice(0, 4) : []; },
  antonyms(w) { const m = w.data?.meanings?.[w.primary.m]; return m ? m.antonyms.slice(0, 2) : []; },
  state(w) {
    const m = w.mem;
    if (!m.reps) return 'new';
    if (m.memorized) return 'memorized';
    // Practicing = recalled on at least one later day, not just right after learning.
    return m.S < 1 || !m.successDays.length ? 'learning' : 'practicing';
  },
  // 0..1 progress toward Memorized, used for the per-word and per-unit bars.
  progress(w) {
    const st = info.state(w);
    if (st === 'new') return 0;
    if (st === 'memorized') return 1;
    const sMem = plan.sMem(w);
    return Math.min(0.95, 0.1 + 0.85 * Math.min(1, Math.log1p(w.mem.S) / Math.log1p(sMem)));
  },
  studyable(w) { return !!info.def(w) && info.active(w); },
  // A word is paused when every list it is in has been archived.
  active(w) { const ns = Object.keys(w.lists || {}); return !ns.length || ns.some(n => !db.lists[n]?.archived); },
};
// Lists that aren't archived, in their usual order.
const liveLists = () => Object.keys(db.lists).filter(n => !db.lists[n].archived);
// Is the word in this list? An empty name means any list.
const inList = (w, name) => !name || Object.hasOwn(w.lists || {}, name);
const STATE_LABEL = { new: 'New', learning: 'Learning', practicing: 'Practicing', memorized: 'Memorized' };
const highlight = (text, word) => esc(text).replace(stemRe(word, 'gi'), m => `<mark>${m}</mark>`);

/* ============================== AI providers ============================== */
// DeepSeek is called directly with an API key. Codex and Claude Code run on the student's own computer through
// bridge/acethewords-bridge.mjs, which uses the login (ChatGPT or Claude plan) the CLI already has.
const BRIDGE_URL = 'http://127.0.0.1:7313/v1/chat/completions';
const BRIDGE_SCRIPT = 'https://raw.githubusercontent.com/itsyuranwei/acethewords/main/bridge/acethewords-bridge.mjs';
const PROVIDERS = {
  deepseek: { name: 'DeepSeek', url: 'https://api.deepseek.com/chat/completions', key: s => s.deepseekKey },
  codex: { name: 'Codex', cli: 'Codex CLI', plan: 'ChatGPT', url: BRIDGE_URL, key: s => s.bridgeToken },
  claude: { name: 'Claude', cli: 'Claude Code', plan: 'Claude', url: BRIDGE_URL, key: s => s.bridgeToken },
};

/* ============================== API status ============================== */
const VISION_MODELS = ['deepseek-flash'];
const api = {
  inFlight: 0,
  lastToast: 0,
  log(e) {
    e.t = clock.now();
    db.apiLog = [e, ...(db.apiLog || [])].slice(0, 40);
    store.save();
    api.paint();
    if (!e.ok && Date.now() - api.lastToast > 8000) {
      api.lastToast = Date.now();
      toast(`${e.svc}: ${api.explain(e.status, e.msg)} Tap “AI” at the top for details.`, 'bad');
    }
  },
  explain(status, msg = '') {
    const p = gen.provider();
    if (status === 0) return p.cli ? 'Could not reach the bridge. Is it running? (node acethewords-bridge.mjs)' : 'Could not connect. Check the internet connection.';
    if (p.cli && status === 401) return 'The bridge token is wrong. Copy it again from the bridge window.';
    if (p.cli && status === 503) return `${p.cli} is not installed on this computer.`;
    if (p.cli && status >= 500) return `${p.cli} failed. Check that it is signed in (run it once in a terminal).`;
    if (status === 'parse') return 'Replied, but not in the expected format.';
    if (status === 400 || status === 422) return /model/i.test(msg) ? 'The model name in Settings is not accepted.' : 'The request was rejected.';
    if (status === 401 || status === 403) return 'The API key is wrong, expired or deleted.';
    if (status === 402) return 'The DeepSeek account has no balance left.';
    if (status === 429) return 'Too many requests at once. Wait a minute and retry.';
    if (status >= 500) return `${p.name} is having problems right now. Try again later.`;
    return 'Something went wrong.';
  },
  lastDS() { return (db.apiLog || []).find(e => e.svc !== 'Dictionary'); },
  state() {
    if (!gen.hasKey()) return 'off';
    if (api.inFlight) return 'busy';
    const l = api.lastDS();
    return !l ? 'idle' : l.ok ? 'ok' : 'bad';
  },
  paint() {
    if (typeof document === 'undefined') return;
    const el = $('#apiPill'); if (!el) return;
    const st = api.state();
    el.className = 'apipill ' + st;
    el.querySelector('.lab').textContent = { off: ' off', busy: ' working', ok: ' ok', bad: ' error', idle: ' ready' }[st];
    const n = gen.provider().name;
    el.title = { off: 'AI not set up', busy: `Talking to ${n}…`, ok: `Last ${n} call worked`, bad: `Last ${n} call failed`, idle: 'Set up, no calls yet' }[st];
    if ($('#apiPanelBody')) $('#apiPanelBody').innerHTML = api.panelHtml();
  },
  panelHtml() {
    const st = api.state(), l = api.lastDS();
    const head = {
      off: 'AI is not set up yet. Connect Codex, Claude Code or a DeepSeek key in Settings to get kid-friendly definitions, sentence questions and photo import.',
      busy: `Working… (${plural(api.inFlight, 'request')} in progress)`,
      ok: `Connected. Last call worked at ${l ? new Date(l.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}.`,
      bad: l ? `Last call failed: ${api.explain(l.status, l.msg)}` : '',
      idle: 'Set up. No calls made yet. Press “Test connection” to check it.',
    }[st];
    const failedWords = Object.values(db.words).filter(w => w.genStatus === 'error').length;
    const rows = (db.apiLog || []).slice(0, 25).map(e => `<div class="log-row">
        <span class="muted">${new Date(e.t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
        <span><b>${esc(e.svc)}</b> · ${esc(e.what || '')}${e.ok ? '' : `<div class="err small">${esc(api.explain(e.status, e.msg))}</div><div class="muted small">${esc(String(e.msg || '').slice(0, 160))}</div>`}</span>
        <span class="${e.ok ? 'ok' : 'err'}">${e.ok ? '✓' : '✗'}${e.ms ? ` <span class="muted small">${(e.ms / 1000).toFixed(1)}s</span>` : ''}</span></div>`).join('');
    return `<div class="statusbox ${st}">${esc(head)}</div>
      ${st === 'bad' && [401, 402, 403].includes(l?.status) ? `<p class="small">${l.status === 402 ? 'Top up the balance at platform.deepseek.com, then retry.' : `Check the ${gen.provider().cli ? 'bridge token' : 'key'} in <a href="#settings" data-act="closeModal">Settings</a>.`}</p>` : ''}
      <div class="row">
        ${gen.hasKey() ? '<button class="btn sm" data-act="apiTest">Test connection</button>' : '<a class="btn sm primary" href="#settings" data-act="closeModal">Open Settings</a>'}
        ${failedWords && gen.hasKey() ? `<button class="btn sm" data-act="apiRetry">Retry ${plural(failedWords, 'failed word')}</button>` : ''}
        <span class="spacer"></span>${rows ? '<button class="btn sm ghost" data-act="apiClear">Clear log</button>' : ''}
      </div>
      <h2 style="font-size:16px">Recent calls</h2>
      ${rows || '<p class="small muted">No calls yet.</p>'}`;
  },
};

/* ============================== dictionary ============================== */
const dict = {
  async lookup(word) {
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        const res = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word));
        if (res.status === 404) return null;
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return dict.parse(await res.json());
      } catch (e) {
        if (attempt === 2) {
          const m = /HTTP (\d+)/.exec(e.message);
          api.log({ svc: 'Dictionary', what: word, ok: false, status: m ? Number(m[1]) : 0, msg: e.message });
          throw e;
        }
        await sleep(800 * 2 ** attempt);
      }
    }
  },
  parse(entries) {
    const out = { phonetic: '', audio: '', meanings: [] };
    for (const e of entries) {
      if (!out.phonetic) out.phonetic = e.phonetic || (e.phonetics || []).find(p => p.text)?.text || '';
      const auds = (e.phonetics || []).map(p => p.audio).filter(Boolean);
      if (!out.audio) out.audio = auds.find(a => /-us\.mp3$/.test(a)) || auds[0] || '';
      for (const m of e.meanings || []) {
        const defs = m.definitions || [];
        out.meanings.push({
          pos: m.partOfSpeech || '',
          defs: defs.slice(0, 6).map(d => ({ def: d.definition, example: d.example || '' })),
          synonyms: uniq([...(m.synonyms || []), ...defs.flatMap(d => d.synonyms || [])]).slice(0, 8),
          antonyms: uniq([...(m.antonyms || []), ...defs.flatMap(d => d.antonyms || [])]).slice(0, 6),
        });
      }
    }
    return out;
  },
};

/* ============================== question writing (AI) ============================== */
const gen = {
  provider() { return PROVIDERS[db.settings.provider] || PROVIDERS.deepseek; },
  hasKey() { return !!String(gen.provider().key(db.settings) || '').trim(); },
  // One request (retried on network errors, 429 and 5xx). Every outcome goes into the API log.
  async call(messages, maxTokens = 1800, { what = '', model = '', json = true } = {}) {
    const p = gen.provider();
    const useModel = p.cli ? db.settings.provider : model || db.settings.model || 'deepseek-flash';
    const t0 = performance.now();
    api.inFlight++; api.paint();
    try {
      for (let attempt = 0; ; attempt++) {
        try {
          return await gen.request(messages, maxTokens, useModel, json, what, t0);
        } catch (e) {
          if (e.cutOff && attempt < 2) { maxTokens *= 2; continue; } // reply ran out of room: retry with double the limit
          const retryable = e.status === 0 || e.status === 429 || e.status >= 500;
          if (!retryable || attempt >= 2) {
            api.log({ svc: p.name, what, ok: false, status: e.status, msg: e.message, model: useModel });
            throw e;
          }
          await sleep(1500 * 2 ** attempt);
        }
      }
    } finally { api.inFlight--; api.paint(); }
  },
  // A plain-text reply that arrives a few words at a time; onText gets each new piece. Used by the chat, where waiting for the
  // whole answer feels slow. Not retried: a reply that already started showing can't be restarted cleanly.
  // The Codex/Claude bridge returns the whole reply at once, so it is handed out word by word to look the same.
  async stream(messages, maxTokens, onText, { what = '' } = {}) {
    const p = gen.provider(), t0 = performance.now();
    const model = p.cli ? db.settings.provider : db.settings.model || 'deepseek-flash';
    api.inFlight++; api.paint();
    try {
      let res;
      try {
        res = await fetch(p.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + String(p.key(db.settings)).trim() },
          body: JSON.stringify(p.cli ? { model, messages } : { model, messages, thinking: { type: 'disabled' }, stream: true, temperature: 0.7, max_tokens: maxTokens }),
        });
      } catch (e) { const err = new Error('Network error: ' + e.message); err.status = 0; throw err; }
      if (!res.ok) {
        let msg = 'HTTP ' + res.status;
        try { const j = await res.json(); if (j.error?.message) msg += ': ' + j.error.message; } catch { /* keep status */ }
        const err = new Error(msg); err.status = res.status; throw err;
      }
      if (p.cli) {
        const text = (await res.json()).choices?.[0]?.message?.content || '';
        for (const piece of text.match(/\S+\s*|\s+/g) || []) { onText(piece); await sleep(35); }
        api.log({ svc: p.name, what, ok: true, ms: Math.round(performance.now() - t0), model });
        return text;
      }
      // Server-sent events: lines of "data: {json}", ending with "data: [DONE]". A line can be split across chunks.
      const reader = res.body.getReader(), dec = new TextDecoder();
      let buf = '', text = '';
      for (;;) {
        const { value, done } = await reader.read();
        buf += dec.decode(value || new Uint8Array(), { stream: !done });
        const lines = buf.split('\n'); buf = done ? '' : lines.pop();
        for (const line of lines) {
          const data = line.replace(/^data:\s*/, '').trim();
          if (!line.startsWith('data:') || !data || data === '[DONE]') continue;
          let piece = '';
          try { piece = JSON.parse(data).choices?.[0]?.delta?.content || ''; } catch { /* skip a malformed event */ }
          if (piece) { text += piece; onText(piece); }
        }
        if (done) break;
      }
      api.log({ svc: p.name, what, ok: true, ms: Math.round(performance.now() - t0), model });
      return text;
    } catch (e) {
      api.log({ svc: p.name, what, ok: false, status: e.status, msg: e.message, model });
      throw e;
    } finally { api.inFlight--; api.paint(); }
  },
  async request(messages, maxTokens, model, json, what, t0) {
    let res;

      const p = gen.provider();

        body: JSON.stringify(p.cli ? { model, messages } : { model, messages, thinking: { type: 'disabled' }, ...(json ? { response_format: { type: 'json_object' } } : {}), temperature: 0.7, max_tokens: maxTokens }),

Dictionary senses:
${senseList}

${which}

Return a JSON object with exactly these keys:
- "sense_index": number of the sense you taught (1-based), or 0 if none fits

- "example": one natural sentence using "${w.word}"
- "blank_sentences": 10 different sentences in different situations, each 12–25 words. Each must be written for the exact form "${w.word}", with that word replaced by "____". Only "${w.word}" may fit, but the student must understand the whole sentence to see why: show the meaning through the situation (a cause, a result, a contrast, or how someone acts or feels). Never put the definition, a synonym or an explanation right next to the blank.
- "blank_easy_distractors": 10 words with the same part of speech and form as "${w.word}", known to a Grade ${g} student, that fit the grammar of the sentences and suit the same general topic, so each looks possible at first glance; the context clues must rule them out. No synonyms, nothing obviously silly
- "blank_hard_distractors": 10 words with the same part of speech and form that are tempting (same topic or a similar feeling) but are NOT synonyms and do not fit any of the sentences when read carefully

- "lookalike_words": up to 8 real English words a student could easily mistake for "${w.word}" at a glance, hardest first. Each must be the same part of speech and the same form (both plural, both past tense…) so grammar gives nothing away; look or sound very close: only 1–3 letters different, a swapped prefix or ending, or the same root (like adverse/averse, eminent/imminent, illicit/elicit); be a word a Grade ${g} student may have seen; and have a clearly DIFFERENT meaning (never a synonym, and never another form of "${w.word}"). Give fewer rather than add loosely similar words

- "incorrect_usages": 10 objects {"sentence": "...", "why": "..."}: sentences that use "${w.word}" in a natural-looking but WRONG way (wrong meaning or wrong part of speech); "why" explains the mistake in at most 20 simple words`;

  // Reads photos of a vocabulary list and returns [{word, definition}] plus a suggested list name.
  async readPhotos(images, instructions, keepMeanings) {
    const g = db.settings.grade;

    const text = `Extract the vocabulary words a student has to learn from ${images.length > 1 ? 'these photos' : 'this photo'}.
Rules:
- Give each word in its dictionary form (lowercase unless it is a proper noun). Keep multi-word phrases together.
- ${keepMeanings ? 'If the photo gives a meaning, definition or translation for a word, copy it into "definition" (shorten to at most 20 words, keep its sense). If none is given, use "". Never invent meanings.' : 'Use "" for every "definition".'}
- Ignore headings, page numbers, instructions and example sentences unless they are the vocabulary items themselves.

${instructions ? `Extra instructions from the parent or teacher (follow them): «${instructions}»\n` : ''}Return JSON: {"words": [{"word": "...", "definition": "..."}], "list_name": "the list's title if the photo shows one, else empty", "notes": "anything unclear or skipped, else empty"}`;

    }
    const words = (Array.isArray(r?.words) ? r.words : [])
      .map(x => (typeof x === 'string' ? { word: x, definition: '' } : x))
      .map(x => ({ word: String(x?.word || '').trim(), definition: keepMeanings ? String(x?.definition || '').replace(/\s+/g, ' ').trim() : '' }))

  validate(w, j) {
    if (!j || typeof j !== 'object') return null;
    const word = w.word.toLowerCase();
    const re = stemRe(w.word);
    const str = x => (typeof x === 'string' ? x.trim() : '');
    const arr = x => (Array.isArray(x) ? x : []);
    // A wrong option that is really a synonym would be marked wrong unfairly.
    const syn = new Set((w.data?.meanings?.[w.primary.m]?.synonyms || []).map(norm));
    const words = x => uniq(arr(x).map(str).map(s => s.toLowerCase()).filter(s => s && s !== word && !re.test(s) && !syn.has(norm(s))));
    const out = {
      pos: str(j.pos).toLowerCase(),

      incorrect_usages: arr(j.incorrect_usages).filter(x => x && re.test(str(x.sentence))).map(x => ({ sentence: str(x.sentence), why: str(x.why) })),
    };
    out.complete = !!(out.simple_definition && out.blank_sentences.length >= 2 && out.blank_easy_distractors.length >= 3 &&
      out.correct_usages.length >= 1 && out.incorrect_usages.length >= 1);

  },
  // Bump when the question prompt changes, so Settings can offer to rewrite older questions.
  VERSION: 3,
  outdated() { return Object.values(db.words).filter(w => w.gen && (w.genVer || 1) < gen.VERSION && info.def(w)); },
  async generate(w) {
    let best = null;
    for (let attempt = 0; attempt < 2 && !best?.complete; attempt++) {
      const out = gen.validate(w, await gen.call(gen.prompt(w), 6000, { what: `Questions for “${w.word}”` }));
      if (out && (!best || out.complete)) best = out;
    }
    if (!best?.simple_definition) throw new Error(`${gen.provider().name} returned unusable content`);
    const senses = info.senses(w).slice(0, 12);
    const s = senses[best.sense_index - 1];
    if (s && !w.primary.manual && !w.customDef) w.primary = { m: s.m, d: s.d, manual: false };
    w.gen = best;
    w.genVer = gen.VERSION;
    w.genStatus = best.complete ? 'ok' : 'partial';
    w.genError = '';
    return best;
  },
};

/* ============================== memory model (FSRS-5) ============================== */
// Default FSRS-5 parameters (open-spaced-repetition). S = stability in days, D = difficulty 1..10,
// R = probability of recall. Grades: 1 Again, 2 Hard, 3 Good, 4 Easy.
const FSRS_W = [0.40255, 1.18385, 3.173, 15.69105, 7.1949, 0.5345, 1.4604, 0.0046, 1.54575, 0.1192,
  1.01925, 1.9395, 0.11, 0.29605, 2.2698, 0.2315, 2.9898, 0.51655, 0.6621];
const DECAY = -0.5, FACTOR = 19 / 81;
/* ============================== answer speed ============================== */
// The hidden timer measures thinking time per question. Raw seconds mean little on their own (a usage question
// takes longer to read than a flashcard), so each time is compared with this student's own recent correct
// answers of the same question type, as a z-score of log time (response times are roughly log-normal).
// Typical thinking time per question type before the student has a history (ms).
const RT_DEFAULT = { card: 4000, meanEasy: 4500, wordEasy: 4500, meanHard: 6000, blankEasy: 7000, wordHard: 6000, blankHard: 8000, usage: 10000 };
const RT_MAX = 60000; // longer than this, the student probably looked away, so the time says nothing
const rt = {
  stats(type) {
    const xs = db.rt?.[type] || [], n = xs.length, k = 10;
    const mu0 = Math.log(RT_DEFAULT[type] || 6000);
    const mean = n ? xs.reduce((a, b) => a + b, 0) / n : mu0;
    const sd = n > 1 ? Math.sqrt(xs.reduce((a, b) => a + (b - mean) ** 2, 0) / (n - 1)) : 0.5;
    // Shrink toward the defaults until there are enough answers.
    return { mu: (n * mean + k * mu0) / (n + k), sd: Math.max(0.25, (n * sd + k * 0.5) / (n + k)) };
  },
  usable: ms => ms > 0 && ms <= RT_MAX,
  // Negative = faster than usual for this student, positive = slower. null when the time is unusable.
  z(type, ms) { if (!rt.usable(ms)) return null; const { mu, sd } = rt.stats(type); return clamp((Math.log(ms) - mu) / sd, -3, 3); },
  // Too fast to have read the question: likely a guess or a misclick (rapid guessing, Wise & Kong 2005).
  rapid(type, ms) { return rt.usable(ms) && ms < Math.max(700, 0.3 * Math.exp(rt.stats(type).mu)); },
  observe(type, ms, ok) {
    if (!ok || !rt.usable(ms) || rt.rapid(type, ms)) return;
    const xs = ((db.rt ||= {})[type] ||= []);
    xs.push(Math.log(ms));
    if (xs.length > 80) xs.splice(0, xs.length - 80);
  },
  // Builds the baselines from saved answers the first time this version runs.
  seed() {
    if (db.rt && Object.keys(db.rt).length) return;
    db.rt = {};
    const hs = Object.values(db.words).flatMap(w => w.mem.history).filter(h => h.g > 1 && rt.usable(h.ms)).sort((a, b) => a.t - b.t);
    for (const h of hs) rt.observe(h.type, h.ms, true);
  },
};

/* ============================== speed-aware recall model ============================== */
// Logistic regression on top of FSRS, predicting whether the next later-day answer to a word will be right:
//   P(correct) = σ(b · x),  x = [1, logit(FSRS recall), speed if last answer right, speed if wrong, last answer too fast, last answer right]
// Speed already shapes the FSRS grade (gradeFor), so the model only needs what speed adds beyond that. It starts
// from small weights in the direction the research points (faster correct answers → stronger memory; very fast
// answers → possible guesses; wrong-answer speed unknown) and learns the real sizes from this student's own answers,
// pulled back toward the starting weights so a few odd answers can't swing it. Logistic, not linear, regression
// because the outcome is right/wrong.
const MODEL_PRIOR = [0, 1, -0.1, 0, -0.2, 0];
const MODEL_LABELS = ['baseline', 'FSRS recall', 'speed of right answers', 'speed of wrong answers', 'too-fast answers', 'last answer right'];
const sigmoid = x => 1 / (1 + Math.exp(-x));
const logit = p => { p = clamp(p, 0.01, 0.99); return Math.log(p / (1 - p)); };
const dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
const logLoss = (p, y) => -Math.log(clamp(y ? p : 1 - p, 1e-4, 1));
const model = {
  get() {
    if (!db.model || db.model.w?.length !== MODEL_PRIOR.length) db.model = { w: MODEL_PRIOR.slice(), n: 0, recent: [] };
    return db.model;
  },
  features(R, h) {
    // A too-fast answer is flagged on its own; its speed isn't read as fluency.
    const ok = h ? h.g > 1 : true, z = h?.fast ? 0 : h?.z ?? 0;
    return [1, logit(R), ok ? z : 0, ok ? 0 : z, h?.fast ? 1 : 0, ok ? 1 : 0];
  },
  predict(R, h) { return sigmoid(dot(model.get().w, model.features(R, h))); },
  // Chance the student gets the word right now, using FSRS plus how the last answer went.
  pNow(w) { return w.mem.reps ? (db.settings.useSpeed ? model.predict(mem.Rnow(w), w.mem.history.at(-1)) : mem.Rnow(w)) : 0; },
  // One online gradient step on a later-day answer. Also keeps a running score of model vs plain FSRS.
  learn(R, h, y) {
    const m = model.get(), x = model.features(R, h), p = sigmoid(dot(m.w, x));
    m.recent.push([+logLoss(p, y).toFixed(4), +logLoss(R, y).toFixed(4)]);
    if (m.recent.length > 300) m.recent.splice(0, m.recent.length - 300);
    const lr = 0.05, l2 = 0.02;
    m.w = m.w.map((b, i) => +(b + lr * ((y - p) * x[i] - l2 * (b - MODEL_PRIOR[i]))).toFixed(5));
    m.w[1] = Math.max(0.3, m.w[1]);
    m.n++;
  },
  // The FSRS recall level at which the model's chance reaches the target: fast confident answers lower it
  // (a longer gap before the next review), slow or too-fast answers raise it (sooner).
  thresholdR(target, h) {
    if (!db.settings.useSpeed || !h) return target;
    const b = model.get().w;
    const c = dot(b, model.features(0.5, h)); // logit(0.5) = 0, so this leaves out the recall term
    return clamp(sigmoid((logit(target) - c) / b[1]), Math.max(0.5, target - 0.2), Math.min(0.98, target + 0.05));
  },
  // How much the next gap stretches or shrinks for an answer of this kind versus a normal-speed one with the same result, for Settings.
  gapFactor(h) {
    const S = 10, base = mem.interval(model.thresholdR(db.settings.retention, { g: h.g, z: 0 }), S);
    return mem.interval(model.thresholdR(db.settings.retention, h), S) / base;
  },
  score() {
    const r = model.get().recent;
    if (r.length < 20) return null;
    const m = r.reduce((a, x) => a + x[0], 0) / r.length, f = r.reduce((a, x) => a + x[1], 0) / r.length;
    return { n: r.length, model: m, fsrs: f, better: (f - m) / f };
  },
};

const TIERS = [['card', 'meanEasy', 'wordEasy'], ['meanHard', 'blankEasy'], ['wordHard', 'blankHard'], ['blankHard', 'usage']];
const HARD_TYPES = ['wordHard', 'blankHard', 'usage'];
const TYPE_TIER = { intro: 0, card: 0, meanEasy: 0, wordEasy: 0, meanHard: 1, blankEasy: 1, wordHard: 2, blankHard: 2, usage: 3 };

const mem = {
  R: (t, S) => Math.pow(1 + FACTOR * t / S, DECAY),
  interval: (r, S) => S / FACTOR * (Math.pow(r, 1 / DECAY) - 1),
  clampD: d => clamp(d, 1, 10),
  D0: G => mem.clampD(FSRS_W[4] - Math.exp(FSRS_W[5] * (G - 1)) + 1),
  S0: G => FSRS_W[G - 1],
  nextD(D, G) {
    const dp = D - FSRS_W[6] * (G - 3) * (10 - D) / 9;
    return mem.clampD(FSRS_W[7] * mem.D0(4) + (1 - FSRS_W[7]) * dp);
  },
  recallS(D, S, R, G) {
    const hard = G === 2 ? FSRS_W[15] : 1, easy = G === 4 ? FSRS_W[16] : 1;
    return S * (1 + Math.exp(FSRS_W[8]) * (11 - D) * Math.pow(S, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - R)) - 1) * hard * easy);
  },
  forgetS(D, S, R) {
    return Math.min(S, FSRS_W[11] * Math.pow(D, -FSRS_W[12]) * (Math.pow(S + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - R)));
  },
  shortTermS(S, G) {
    let inc = Math.exp(FSRS_W[17] * (G - 3 + FSRS_W[18]));
    if (G >= 2) inc = Math.max(1, inc); // a correct same-day answer never lowers stability
    return S * inc;
  },
  Rnow(w) { const m = w.mem; return m.reps ? mem.R((clock.now() - m.lastReview) / DAY, m.S) : 0; },

  // Converts a question result into an FSRS grade (recognition counts less than recall).
  // Speed is judged against this student's usual time for the question type, not fixed seconds.
  gradeFor(type, ok, ms) {
    if (!ok) return 1;
    let g = (type === 'meanEasy' || type === 'wordEasy') ? 2 : 3;
    if (!db.settings.useSpeed) return g;
    if (rt.rapid(type, ms)) return 2; // too fast to have read it: might be a lucky guess
    const z = rt.z(type, ms);
    // Quick, correct recall on a hard question (not 2-option usage, where guessing is easy) shows fluency.
    if (z != null && z < -0.8 && HARD_TYPES.includes(type) && type !== 'usage') g = 4;
    if (z != null && z > 1.2) g = Math.max(2, g - 1); // right, but slow for this student
    return g;
  },

  review(w, G, type, ms) {
    const m = w.mem, now = clock.now(), today = dayKey(now);
    const longTerm = m.reps > 0 && m.lastDay !== today;
    if (!m.reps) {
      m.S = mem.S0(G); m.D = mem.D0(G);
    } else {
      if (longTerm) {
        const r = mem.R((now - m.lastReview) / DAY, m.S);
        m.S = G === 1 ? mem.forgetS(m.D, m.S, r) : mem.recallS(m.D, m.S, r, G);
      } else {
        m.S = mem.shortTermS(m.S, G);
      }
      m.D = mem.nextD(m.D, G);
    }
    m.S = Math.max(0.01, m.S);
    if (G === 1) { if (longTerm || m.memorized) m.lapses++; m.memorized = false; }
    if (longTerm && G >= 2 && !m.successDays.includes(today)) m.successDays.push(today);
    m.reps++; m.lastReview = now; m.lastDay = today;
    m.history.push({ t: now, type, g: G, ms: Math.round(ms || 0) });
    if (m.history.length > 40) m.history.splice(0, m.history.length - 40);
    if (!m.memorized && G >= 2 && HARD_TYPES.includes(type) && m.S >= plan.sMem(w) && m.successDays.length >= 3) m.memorized = true;
  },

  // Memorized words that have faded too far go back to practice.
  refreshAll() {
    for (const w of Object.values(db.words)) if (w.mem.memorized && mem.Rnow(w) < 0.6) w.mem.memorized = false;
  },

  // Picks a question type a little above the word's current strength (desirable difficulty).
  ladder(w, allowed = null) {
    const m = w.mem;
    let tier = !m.reps ? 0 : m.S < 1 ? 0 : m.S < 4 ? 1 : m.S < 10 ? 2 : 3;
    if (m.reps && mem.Rnow(w) < 0.75) tier = Math.max(0, tier - 1);
    const last = m.history[m.history.length - 1]?.type;
    for (let t = tier; t >= 0; t--) {
      let types = TIERS[t].filter(x => (!allowed || allowed.includes(x)) && qfx.can(x, w));
      if (types.length > 1) types = types.filter(x => x !== last);
      if (types.length) return pick(types);
    }
    return allowed ? (allowed.find(x => qfx.can(x, w)) || 'meanEasy') : 'meanEasy';
  },
  easier(type, w) {
    const t = Math.max(0, (TYPE_TIER[type] || 0) - 1);
    const types = TIERS[t].filter(x => x !== 'card' && qfx.can(x, w));
    return types.length ? pick(types) : 'meanEasy';
  },
};

/* ============================== planner ============================== */
const plan = {
  listWords(name) { return (db.lists[name]?.units || []).flat().map(k => db.words[k]).filter(Boolean); },
  testInfo(list) {
    if (!list?.testDate) return null;
    const d = daysUntil(list.testDate);
    return { d, start: parseDay(list.testDate), upcoming: d >= 0, passed: d < 0 };
  },
  // Desired retention rises toward 0.95 in the final week before a test; maintenance after it.
  retention(list) {
    const base = db.settings.retention;
    const t = plan.testInfo(list);
    if (!t) return base;
    if (t.passed) return Math.min(base, 0.85);
    if (t.d <= 7) { const top = Math.max(base, 0.95); return base + (top - base) * (1 - Math.max(0, t.d - 1) / 6); }
    return base;
  },
  // A word in several lists is paced by the one with the nearest upcoming test, then a list without a test, then one whose test has passed.
  pacingList(w) {
    let best = db.lists[w.list], bestRank = Infinity;
    for (const n of Object.keys(w.lists || {})) {
      const t = plan.testInfo(db.lists[n]);
      const rank = !t ? 1e6 : t.upcoming ? t.d : 2e6;
      if (rank < bestRank) { bestRank = rank; best = db.lists[n]; }
    }
    return best;
  },
  sMem(w) {
    const t = plan.testInfo(plan.pacingList(w));
    return t && t.upcoming ? clamp(1.5 * t.d, 7, 21) : 21;
  },
  dueAt(w) {
    const m = w.mem;
    if (!m.reps) return Infinity;
    const list = plan.pacingList(w);
    let due = m.lastReview + mem.interval(model.thresholdR(plan.retention(list), m.history.at(-1)), m.S) * DAY;
    const t = plan.testInfo(list);
    if (t && t.upcoming) {
      const cap = t.start - DAY; // make sure every word is seen the day before the test
      if (m.lastReview < cap && due > cap) due = cap;
    }
    return due;
  },
  isDueToday(w) { return plan.dueAt(w) < startOfDay(clock.now()) + DAY; },
  introducedToday(list) { return list.newLog?.date === todayKey() ? list.newLog.count : 0; },
  countNew(name) {
    const list = db.lists[name]; if (!list) return;
    const today = todayKey();
    if (list.newLog?.date !== today) list.newLog = { date: today, count: 0 };
    list.newLog.count++;
  },
  newPerDay(name, poolAtDayStart) {
    const t = plan.testInfo(db.lists[name]);
    // With a test: at least the normal daily amount, more if needed to finish 2 days early.
    if (t && t.upcoming) return Math.max(db.settings.newPerDay, Math.ceil(poolAtDayStart / Math.max(1, t.d - 2)));
    return db.settings.newPerDay;
  },
  // New words this list may still introduce today.
  newAllowance(name) {
    const list = db.lists[name]; if (!list) return 0;
    const remaining = plan.listWords(name).filter(w => !w.mem.reps && info.studyable(w)).length;
    const intro = plan.introducedToday(list);
    return Math.max(0, Math.min(remaining, plan.newPerDay(name, remaining + intro) - intro));
  },
  // New words in study order. Lists with a test unlock units by pace; others only use unlocked units.
  learnQueue(name, n = Infinity) {
    const list = db.lists[name]; if (!list) return [];
    const t = plan.testInfo(list);
    const maxUnit = t && t.upcoming ? list.units.length : list.unlocked;
    const out = [];
    for (let u = 0; u < maxUnit && out.length < n; u++) {
      for (const k of list.units[u] || []) {
        const w = db.words[k];
        if (w && !w.mem.reps && info.studyable(w)) { out.push(w); if (out.length >= n) break; }
      }
    }
    return out;
  },
  readiness(name) {
    const list = db.lists[name];
    const t = plan.testInfo(list);
    const ws = plan.listWords(name).filter(info.studyable);
    if (!ws.length) return 0;
    const at = t && t.upcoming ? t.start + DAY / 3 : clock.now();
    return ws.reduce((a, w) => a + (w.mem.reps ? mem.R(Math.max(0, at - w.mem.lastReview) / DAY, w.mem.S) : 0), 0) / ws.length;
  },
  dueWords(filter = () => true) { return Object.values(db.words).filter(w => w.mem.reps && info.studyable(w) && filter(w) && plan.isDueToday(w)); },
  // Questions answered today for one list's words.
  doneToday(name) {
    const sod = startOfDay(clock.now());
    return plan.listWords(name).reduce((a, w) => a + w.mem.history.filter(h => h.t >= sod).length, 0);
  },
  // Today's workload for one list, or for all lists when name is empty.
  today(name = '') {
    const names = name ? [name] : liveLists();
    const newLeft = names.reduce((a, n) => a + Math.min(plan.newAllowance(n), plan.learnQueue(n).length), 0);
    const due = plan.dueWords(w => inList(w, name)).length;
    const remainingQ = newLeft * 4 + due;
    const done = name ? plan.doneToday(name) : db.daily.date === todayKey() ? db.daily.done : 0;
    const times = Object.values(db.words).flatMap(w => w.mem.history.map(h => h.ms)).filter(x => x > 0 && x < 60000).slice(-200).sort((a, b) => a - b);
    const sec = (times.length ? times[Math.floor(times.length / 2)] / 1000 : 8) + 4;
    const cap = db.settings.dailyCap;
    return { newLeft, due, done, planned: Math.max(done, Math.min(done + remainingQ, Math.max(cap, done))), mins: Math.ceil(Math.min(remainingQ, cap) * sec / 60), overflow: Math.max(0, remainingQ - cap) };
  },
  forecast(days = 14, only = '') {
    const sod = startOfDay(clock.now());
    const cols = Array.from({ length: days }, (_, i) => ({ day: dayKey(sod + i * DAY + DAY / 2), rev: 0, nw: 0, test: false }));
    for (const w of Object.values(db.words)) {
      if (!w.mem.reps || !info.studyable(w) || !inList(w, only)) continue;
      const i = Math.max(0, Math.floor((startOfDay(plan.dueAt(w)) - sod) / DAY + 0.5));
      if (i < days) cols[i].rev++;
    }
    for (const [name, list] of Object.entries(db.lists)) {
      if (only && name !== only) continue;
      const t = plan.testInfo(list);
      let rem = plan.listWords(name).filter(w => !w.mem.reps && info.studyable(w)).length;
      for (let i = 0; i < days && rem > 0; i++) {
        let n;
        if (i === 0) n = plan.newAllowance(name);
        else if (t && t.upcoming) n = t.d - i >= 1 ? Math.max(db.settings.newPerDay, Math.ceil(rem / Math.max(1, t.d - i - 2))) : 0;
        else n = db.settings.newPerDay;
        n = Math.min(rem, n); cols[i].nw += n; rem -= n;
      }
      if (t && t.upcoming && t.d < days) cols[t.d].test = true;
    }
    return cols;
  },
  warnings(name) {
    const list = db.lists[name];
    const t = plan.testInfo(list);
    const out = [];
    if (t && t.upcoming) {
      const remaining = plan.listWords(name).filter(w => !w.mem.reps && info.studyable(w)).length;
      const per = plan.newPerDay(name, remaining + plan.introducedToday(list));
      if (remaining && per > 25) out.push(`${remaining} new words in ${plural(t.d, 'day')} means about ${per} new words a day — that's a lot. Consider moving the test date or focusing on the most important units.`);
      if (t.d <= 1 && remaining) out.push(`${plural(remaining, 'word')} still not learned and the test is ${t.d === 0 ? 'today' : 'tomorrow'}.`);
    }
    if (t && t.passed) out.push('The test date has passed — this list is in maintenance mode (longer gaps). Set a new date for the next test.');
    return out;
  },
};

/* ============================== units ============================== */
const units = {
  defaultSize(name, total) {
    const t = plan.testInfo(db.lists[name] || { testDate: units._pendingTest });
    if (t && t.upcoming) return clamp(Math.max(db.settings.newPerDay, Math.ceil(total / Math.max(1, t.d - 2))), 10, 30);
    const g = Number(db.settings.grade);
    return g <= 5 ? 12 : g <= 8 ? 20 : 25;
  },
  split(keys, size) {
    if (!keys.length) return [];
    const n = keys.length <= size * 1.25 ? 1 : Math.ceil(keys.length / size);
    const base = Math.floor(keys.length / n), extra = keys.length % n;
    const out = []; let i = 0;
    for (let u = 0; u < n; u++) { const len = base + (u < extra ? 1 : 0); out.push(keys.slice(i, i + len)); i += len; }
    return out;
  },
  create(name, keys, testDate) {
    units._pendingTest = testDate || '';
    const size = units.defaultSize(name, keys.length);
    units._pendingTest = '';
    db.lists[name] = { name, testDate: testDate || '', unitSize: size, units: units.split(keys, size), unlocked: 1, newLog: null, createdAt: clock.now() };
    units.reindex(name);
  },
  // New words fill the last unit up to the unit size, then start new units.
  append(name, keys) {
    const list = db.lists[name];
    if (!list) return units.create(name, keys, '');
    keys = keys.slice();
    // A list created empty picks its unit size when the first words arrive.
    if (!list.units.length) list.unitSize = units.defaultSize(name, keys.length);
    const last = list.units[list.units.length - 1];
    if (last) while (keys.length && last.length < list.unitSize) last.push(keys.shift());
    if (keys.length) list.units.push(...units.split(keys, list.unitSize));
    units.reindex(name);
  },
  // Rebuilds every word's lists (w.lists: list name → unit index) from the lists' units.
  // w.list / w.unit keep the first one so older copies of the app can still read the data.
  reindex() {
    for (const w of Object.values(db.words)) w.lists = {};
    for (const [name, list] of Object.entries(db.lists)) {
      list.units.forEach((u, i) => u.forEach(k => { const w = db.words[k]; if (w && !Object.hasOwn(w.lists, name)) w.lists[name] = i; }));
    }
    for (const w of Object.values(db.words)) { const first = Object.entries(w.lists)[0]; if (first) [w.list, w.unit] = first; }
  },
  // A word that no list holds (from a damaged backup) goes back into the list it last named.
  adoptOrphans() {
    for (const w of Object.values(db.words)) if (!Object.keys(w.lists).length) units.append(w.list || 'My words', [w.word]);
  },
  // Takes a word out of one list only. Call reindex afterwards.
  removeFrom(name, k) {
    const list = db.lists[name]; if (!list) return;
    list.units = list.units.map(u => u.filter(x => x !== k)).filter(u => u.length);
    list.unlocked = clamp(list.unlocked, 1, Math.max(1, list.units.length));
  },
  unitWords(list, i) { return (list.units[i] || []).map(k => db.words[k]).filter(w => w && info.studyable(w)); },
  progress(list, i) { const ws = units.unitWords(list, i); return ws.length ? ws.reduce((a, w) => a + info.progress(w), 0) / ws.length : 0; },
  // The next unit opens when 80% of the current one is Practicing or better.
  autoUnlock(name) {
    const list = db.lists[name]; if (!list) return false;
    let changed = false;
    while (list.unlocked < list.units.length) {
      const ws = units.unitWords(list, list.unlocked - 1);
      const ready = ws.filter(w => ['practicing', 'memorized'].includes(info.state(w))).length;
      if (ws.length && ready < 0.8 * ws.length) break;
      list.unlocked++; changed = true;
    }
    return changed;
  },
  currentUnit(list) {
    for (let i = 0; i < list.units.length; i++) if (units.unitWords(list, i).some(w => !w.mem.reps)) return i;
    return list.units.length - 1;
  },
};
