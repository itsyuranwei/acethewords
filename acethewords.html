<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AceTheWords</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/acethewords.css?v=1">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand"><div class="brand-dot">A</div><span class="name">AceTheWords</span></div>
    <button class="apipill" id="apiPill" data-act="apiPanel" title="AI connection"><i></i>AI<span class="lab"></span></button>
    <nav class="nav" id="nav">
      <a href="#home" data-r="home">Home</a>
      <a href="#add" data-r="add">Add</a>
      <a href="#words" data-r="words">Words</a>
      <a href="#settings" data-r="settings">Settings</a>
    </nav>
  </div>
</header>
<main class="wrap" id="app"></main>
<footer class="wrap sitefoot">Enjoying AceTheWords? <a class="starbtn" href="https://github.com/itsyuranwei/acethewords" target="_blank" rel="noopener">⭐ Star it on GitHub<span id="starCount"></span></a></footer>
<div id="session" hidden></div>
<div id="modal"></div>
<div id="toasts"></div>
<div id="stale"></div>
<div id="askai"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<input type="file" id="importList" accept=".atw" hidden>

<!-- The app, in load order. Plain scripts (not modules) so a downloaded copy opened from disk still works.
     Bump ?v= when these files change, so browsers fetch the new versions together. -->
<script src="js/core.js?v=1"></script>
<script src="js/ai.js?v=1"></script>
<script src="js/memory.js?v=1"></script>
<script src="js/questions.js?v=2"></script>
<script src="js/session.js?v=2"></script>
<script src="js/ui.js?v=2"></script>
<script src="js/askai.js?v=1"></script>
<script src="js/listfile.js?v=1"></script>
<script src="js/input.js?v=1"></script>
<script src="js/main.js?v=1"></script>
</body>
</html>
