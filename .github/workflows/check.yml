name: Check site

# Pushing to main publishes the live site on GitHub Pages straight away,
# so check every pull request before it is merged.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: JavaScript, links, and app opens in a browser
    runs-on: ubuntu-24.04  # pinned: Playwright 1.56.1 does not support ubuntu-latest (26.04)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install headless browser
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Check the site
        run: node .github/scripts/check-site.mjs
